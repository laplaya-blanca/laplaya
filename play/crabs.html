<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBF7EE">
<title>Crab Pop · La Playa Blanca</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="preload" href="/assets/sand-tall.jpg" as="image">
<link rel="icon" href="/assets/logo.jpg">
<link rel="stylesheet" href="play.css">
<script src="kit.js"></script>
</head>
<body class="game">
<div class="top"><a class="back" href="./" data-keep aria-label="All games"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg><span>Games</span></a><h1>Crab Pop</h1><button class="snd" id="snd" type="button"></button></div>
<div class="wrap"><div class="stage" id="stage">
  <canvas id="cv" aria-label="The beach, with nine crab holes. Tap the crabs as they pop out, or press 1 to 9 for the holes."></canvas>
  <div class="overlay" id="ov"></div>
</div></div>
<p class="foot">30 seconds each. Pass the phone, best score wins.</p>
<p class="sr" id="live" aria-live="polite"></p>

<script>
const cv = document.getElementById('cv'), stage = document.getElementById('stage'), ov = document.getElementById('ov');
const ctx = cv.getContext('2d');
let raf = 0, last = 0;
soundSwitch(document.getElementById('snd'));

// ——— the beach: the menu's own shore seen from above (the footer's photo), nine burrows in the sand ———
const AR = 3 / 4, ROUND = 30;
const HUMANS = [{ e: '🐚', c: '#1F7A8C' }, { e: '🐠', c: '#E7607A' }, { e: '🌴', c: '#5f8f2f' }, { e: '⭐', c: '#d08a1e' }];
// where the holes are, as fractions of the board: three rows, each a little off the straight line
const SPOTS = [[0.19, 0.45], [0.5, 0.43], [0.81, 0.455], [0.18, 0.645], [0.5, 0.625], [0.82, 0.65], [0.2, 0.845], [0.5, 0.83], [0.8, 0.85]];
const photo = new Image(); photo.decoding = 'async'; photo.src = '/assets/sand-tall.jpg'; photo.onload = () => fit();
let W = 0, H = 0, S = 1, DPR = 1, U = 0, bg = null, lips = null, holes = [];

function fit() {
  sizeStage(stage, AR);
  if (!V.W) return;
  ({ W, H, S, DPR } = V); U = W / 100; // U: a hundredth of the board's width
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR); clearCaches(); tints.clear(); halos.clear();
  holes = SPOTS.map(([x, y], i) => ({ ...(holes[i] || { kind: null, popped: -9 }), x: x * W, y: y * H, rx: 12.5 * U, ry: 4.6 * U, i })); // a crab that's up stays up
  bg = paintBeach(); lips = paintLips();
  if (!G.running) draw();
}
addEventListener('resize', fit);
fontsReady(fit);

function layer(paint) {
  const c = document.createElement('canvas'); c.width = Math.round(W * DPR); c.height = Math.round(H * DPR);
  const g = c.getContext('2d'); g.scale(DPR, DPR); paint(g); return c;
}
function paintBeach() {
  return layer((g) => {
    if (photo.complete && photo.naturalWidth) {
      const k = W / photo.naturalWidth; g.drawImage(photo, 0, 0, W, photo.naturalHeight * k); // sea at the top, the rest sand
    } else {
      const s = g.createLinearGradient(0, 0, 0, H); s.addColorStop(0, '#1e5a5f'); s.addColorStop(0.22, '#2f7c7c'); s.addColorStop(0.26, '#e9dcc4'); s.addColorStop(1, '#efe6d6');
      g.fillStyle = s; g.fillRect(0, 0, W, H);
    }
    // a soft darkening over the sea, so the score reads; a little warmth over the sand
    const top = g.createLinearGradient(0, 0, 0, H * 0.3); top.addColorStop(0, 'rgba(3,26,33,.42)'); top.addColorStop(1, 'rgba(3,26,33,0)');
    g.fillStyle = top; g.fillRect(0, 0, W, H * 0.3);
    g.fillStyle = 'rgba(232,180,110,.08)'; g.fillRect(0, H * 0.3, W, H * 0.7);
    // each burrow: a heap of dug sand around it, then the dark hole
    for (const h of holes) {
      const mound = g.createRadialGradient(h.x, h.y + h.ry * 0.3, h.rx * 0.6, h.x, h.y + h.ry * 0.3, h.rx * 1.35);
      mound.addColorStop(0, 'rgba(120,88,52,.35)'); mound.addColorStop(1, 'rgba(120,88,52,0)');
      g.fillStyle = mound; g.beginPath(); g.ellipse(h.x, h.y + h.ry * 0.3, h.rx * 1.4, h.ry * 2.1, 0, 0, 7); g.fill();
      const pit = g.createRadialGradient(h.x, h.y + h.ry * 0.25, 1, h.x, h.y, h.rx);
      pit.addColorStop(0, '#2a1c10'); pit.addColorStop(0.7, '#4a3420'); pit.addColorStop(1, '#7a5a38');
      g.fillStyle = pit; g.beginPath(); g.ellipse(h.x, h.y, h.rx, h.ry, 0, 0, 7); g.fill();
    }
  });
}
// the near rim of every hole, drawn over a crab so it really comes up out of the sand
function paintLips() {
  return layer((g) => {
    for (const h of holes) {
      g.save(); g.beginPath(); g.rect(h.x - h.rx * 1.5, h.y, h.rx * 3, h.ry * 3); g.clip();
      const rim = g.createLinearGradient(0, h.y, 0, h.y + h.ry * 1.4); rim.addColorStop(0, 'rgba(206,182,142,.95)'); rim.addColorStop(1, 'rgba(236,224,200,0)');
      g.fillStyle = rim; g.beginPath(); g.ellipse(h.x, h.y + h.ry * 0.1, h.rx * 1.05, h.ry * 1.18, 0, 0, 7);
      g.ellipse(h.x, h.y - h.ry * 0.02, h.rx * 0.98, h.ry * 0.96, 0, 0, 7, true); g.fill('evenodd');
      g.strokeStyle = 'rgba(60,38,16,.35)'; g.lineWidth = 1.2 * S; g.beginPath(); g.ellipse(h.x, h.y - h.ry * 0.02, h.rx * 0.98, h.ry * 0.96, 0, 0.08, Math.PI - 0.08); g.stroke();
      g.restore();
    }
  });
}
// a golden crab: the crab, washed in gold, drawn once
const tints = new Map();
function gold(px) {
  const k = px; if (tints.has(k)) return tints.get(k);
  const base = sprite('🦀', px), c = document.createElement('canvas'); c.width = base.width; c.height = base.height;
  const g = c.getContext('2d'); g.drawImage(base, 0, 0); g.globalCompositeOperation = 'source-atop';
  const sheen = g.createLinearGradient(0, 0, c.width, c.height); sheen.addColorStop(0, 'rgba(255,226,120,.75)'); sheen.addColorStop(1, 'rgba(232,150,30,.7)');
  g.fillStyle = sheen; g.fillRect(0, 0, c.width, c.height); tints.set(k, c); return c;
}

// the warm light behind a golden crab, drawn once per size
const halos = new Map();
function glow(px) {
  if (halos.has(px)) return halos.get(px);
  const d = Math.ceil(px * 1.5), c = document.createElement('canvas'); c.width = c.height = Math.ceil(d * DPR);
  const g = c.getContext('2d'); g.scale(DPR, DPR);
  const r = g.createRadialGradient(d / 2, d / 2, 1, d / 2, d / 2, d / 2); r.addColorStop(0, 'rgba(255,214,102,.55)'); r.addColorStop(1, 'rgba(255,214,102,0)');
  g.fillStyle = r; g.fillRect(0, 0, d, d); halos.set(px, c); return c;
}
// a piece of the score board, drawn again only when what it shows changes (its soft shadow is a blur, too slow to
// redraw every frame on a cheap phone)
const panels = {};
function panel(slot, key, w, h, paint) {
  let p = panels[slot];
  if (!p || p.key !== key || p.dpr !== DPR) {
    const c = p?.c || document.createElement('canvas'); c.width = Math.ceil(w * DPR); c.height = Math.ceil(h * DPR);
    const g = c.getContext('2d'); g.setTransform(DPR, 0, 0, DPR, 0, 0); g.clearRect(0, 0, w, h); paint(g);
    p = panels[slot] = { c, key, w, h, dpr: DPR };
  }
  return p;
}

// ——— the game ———
const KINDS = { crab: { e: '🦀', pts: 1 }, gold: { e: '🦀', pts: 3 }, puffer: { e: '🐡', pts: -3 } };
const RISE = 0.13, SINK = 0.15;
const G = { running: false, players: [], cur: 0, state: 'setup', time: ROUND, count: 0, clock: 0, spawn: 0, combo: 0, score: 0, best: store.get('crabs-best'), lastTick: 0, lastHole: -1, shake: 0 };
const who = (i) => (G.players.length === 1 ? 'You' : `Player ${i + 1}`);
const mult = () => (G.combo >= 10 ? 3 : G.combo >= 5 ? 2 : 1);

function setup(n) {
  G.players = HUMANS.slice(0, n).map((h) => ({ ...h, score: null }));
  G.cur = 0; ready();
}
// before each turn: who's up (with friends), then 3, 2, 1
function ready() {
  const p = G.players[G.cur];
  if (G.players.length === 1) return countdown();
  stop(); G.state = 'ready'; draw(); // the board behind "you're up" is bare: no score or clock from the turn before
  overlay(ov, `<div class="avatar">${p.e}</div><h2>${who(G.cur)}, you’re up</h2><p>${G.cur ? 'Pass the phone. ' : ''}30 seconds: pop as many crabs as you can.</p>`, [{ label: 'Go!', go: countdown }]);
}
function countdown() {
  for (const h of holes) h.kind = null;
  clearFx(); G.score = 0; G.combo = 0; G.time = ROUND; G.count = 3; G.spawn = 0.6; G.lastTick = 0; G.lastHole = -1;
  G.state = 'count'; ov.hidden = true; focusKeyed(cv);
  tell(`${who(G.cur)}: 3, 2, 1…`); tone(520, 0.12, { vol: 0.05 });
  G.running = true; cancelAnimationFrame(raf); last = performance.now(); raf = requestAnimationFrame(loop);
}
function stop() { G.running = false; cancelAnimationFrame(raf); }
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000 || 0); last = now;
  update(dt); stepFx(dt); draw();
  if (G.running) raf = requestAnimationFrame(loop);
}
function pop(h, f) {
  const r = Math.random(), kind = f > 0.12 && r < 0.17 ? 'puffer' : r > 0.92 ? 'gold' : 'crab';
  Object.assign(h, { kind, t: 0, up: lerp(1.15, 0.6, f) * (kind === 'gold' ? 0.72 : kind === 'puffer' ? 1.25 : 1) * rnd(0.85, 1.15), hit: 0, wob: rnd(0, 6) });
  tone(kind === 'puffer' ? 260 : 380, 0.07, { type: 'sine', to: kind === 'puffer' ? 200 : 560, vol: 0.025 });
}
// how far out of its hole a crab is: 0 hidden, 1 all the way up
function out(h) {
  if (!h.kind) return 0;
  if (h.hit) return Math.max(0, 1 - h.hit / 0.22);
  if (h.t < RISE) return ease(h.t / RISE);
  if (h.t < RISE + h.up) return 1;
  return Math.max(0, 1 - (h.t - RISE - h.up) / SINK);
}
function update(dt) {
  G.clock += dt; G.shake = Math.max(0, G.shake - dt);
  if (G.state === 'count') {
    const before = Math.ceil(G.count); G.count -= dt; const now = Math.ceil(G.count);
    if (now !== before && now > 0) tone(520, 0.12, { vol: 0.05 });
    if (G.count <= 0) { G.state = 'play'; tone(880, 0.18, { vol: 0.06 }); tell('Go!'); }
    return;
  }
  if (G.state !== 'play') return;
  G.time -= dt;
  const f = clamp(1 - G.time / ROUND, 0, 1);
  // the last five seconds tick
  const sec = Math.ceil(G.time);
  if (sec <= 5 && sec > 0 && sec !== G.lastTick) { G.lastTick = sec; tone(1200, 0.04, { type: 'square', vol: 0.02 }); }
  for (const h of holes) {
    if (!h.kind) continue;
    if (h.hit) { h.hit += dt; if (h.hit > 0.22) h.kind = null; continue; }
    h.t += dt;
    if (h.t > RISE + h.up + SINK) { if (h.kind !== 'puffer' && G.combo) { G.combo = 0; } h.kind = null; }
  }
  // more crabs, quicker, as the clock runs down
  G.spawn -= dt;
  const busy = holes.filter((h) => h.kind).length, most = Math.min(4, 1 + Math.floor(f * 3.3));
  if (G.spawn <= 0 && G.time > 0.4) {
    if (busy < most) {
      const free = holes.filter((h) => !h.kind && h.i !== G.lastHole);
      if (free.length) { const h = free[(Math.random() * free.length) | 0]; pop(h, f); G.lastHole = h.i; }
    }
    G.spawn = lerp(0.8, 0.36, f) * rnd(0.8, 1.2);
  }
  if (G.time <= 0) end();
}
function hit(x, y) {
  if (G.state !== 'play') return;
  let best = null, bd = Infinity;
  for (const h of holes) {
    const o = out(h); if (!h.kind || h.hit || o < 0.3) continue;
    const cy = h.y - 9 * U * o, d = Math.hypot(x - h.x, (y - cy) * 0.85);
    if (d < 15 * U && d < bd) { bd = d; best = h; }
  }
  if (!best) {
    // a second tap on a crab that's just been popped isn't a miss, even once it has gone (a double tap)
    if (holes.some((h) => G.clock - h.popped < 0.4 && Math.hypot(x - h.x, (y - (h.y - 4.5 * U)) * 0.85) < 15 * U)) return;
    // a tap on bare sand: a puff, and the combo is gone
    burst(x, y, '#d9c4a0', 6, 60 * S, { g: 300, size: 2 }); if (G.combo >= 3) say(x, y - 4 * U, 'Combo lost', '#4b6870', 15); G.combo = 0; return;
  }
  const h = best, k = KINDS[h.kind], cy = h.y - 9 * U;
  h.hit = 0.0001; h.popped = G.clock;
  if (h.kind === 'puffer') {
    G.score = Math.max(0, G.score + k.pts); G.combo = 0; G.shake = 0.25; buzz([40, 30, 40]);
    say(h.x, cy - 9 * U, 'Ouch! −3', '#E7607A', 22); tone(220, 0.35, { type: 'sawtooth', to: 90, vol: 0.05 });
    burst(h.x, cy, '#f2c14e', 10, 120 * S, { g: 200, size: 2.5 });
  } else {
    G.combo++; const gain = k.pts * mult(); G.score += gain;
    say(h.x, cy - 9 * U, (h.kind === 'gold' ? 'Golden! +' : '+') + gain, h.kind === 'gold' ? '#c27a12' : '#14586B', h.kind === 'gold' ? 22 : 20);
    if (G.combo === 5 || G.combo === 10) say(W / 2, H * 0.3, `Combo ×${mult()}!`, '#E7607A', 24);
    tone(560 + Math.min(G.combo, 14) * 38, 0.06, { type: 'triangle', vol: 0.06 });
    if (h.kind === 'gold') chord([988, 1319, 1568], 0.05, { vol: 0.04 });
    buzz(h.kind === 'gold' ? 25 : 10);
    burst(h.x, cy, h.kind === 'gold' ? '#ffd166' : '#ffffff', h.kind === 'gold' ? 18 : 10, 150 * S, { g: 250, size: 2.6 });
    ring(h.x, cy, 6 * U, h.kind === 'gold' ? '#E8A44C' : '#ffffff');
  }
}
function end() {
  G.state = 'done'; G.time = 0; for (const h of holes) h.kind = null;
  const p = G.players[G.cur]; p.score = G.score;
  chord([784, 659, 523], 0.1, { vol: 0.05 }); buzz(60); tell(`Time! ${who(G.cur)} popped ${G.score}.`);
  // the last turn of a game with friends: confetti for a single winner, while the board is still moving
  const last = G.players.length > 1 && G.cur === G.players.length - 1;
  const order = last ? G.players.map((q, i) => ({ ...q, i })).sort((a, b) => b.score - a.score) : [], top = order.length ? order[0].score : 0, winners = order.filter((q) => q.score === top);
  if (last && winners.length === 1) {
    setTimeout(() => chord([523, 659, 784, 1047, 1319], 0.08), 350);
    const colors = ['#E7607A', '#E8A44C', '#1F7A8C', '#86c23f', '#fff'];
    for (let k = 0; k < 5; k++) setTimeout(() => burst(rnd(W * 0.15, W * 0.85), rnd(H * 0.1, H * 0.5), colors[k % 5], 22, 280 * S, { g: 380, size: 3.2 }), 300 + k * 140);
  }
  setTimeout(() => {
    stop(); draw();
    if (G.players.length === 1) {
      const record = G.score > G.best; if (record) { G.best = G.score; store.set('crabs-best', G.score); }
      overlay(ov, `<div class="avatar">🦀</div><h2>${record && G.score ? 'A new best!' : 'Time!'}</h2><div class="big">${G.score}</div><p>${record && G.score ? 'Your best on this phone.' : `Your best: ${G.best}`}</p>`,
        [{ label: 'Play again', go: countdown }, { label: 'Play with friends', alt: true, go: menu }]);
    } else if (G.cur < G.players.length - 1) {
      const next = G.players[G.cur + 1];
      overlay(ov, `<div class="avatar">${p.e}</div><h2>Time! ${G.score} popped</h2><p>Next up: ${who(G.cur + 1)} ${next.e}. Pass the phone.</p>`,
        [{ label: `${who(G.cur + 1)}, go!`, go: () => { G.cur++; countdown(); } }]);
    } else {
      overlay(ov, `<div class="avatar">${winners.length === 1 ? winners[0].e : '🤝'}</div><h2>${winners.length === 1 ? who(winners[0].i) + ' wins!' : 'It’s a tie!'}</h2>
        <ol class="ranks">${order.map((q) => `<li class="${q.score === top ? 'win' : ''}"><span>${q.e}</span><span>${who(q.i)}</span><span>${q.score}</span></li>`).join('')}</ol>`,
        [{ label: 'Play again', go: () => { G.cur = 0; for (const q of G.players) q.score = null; ready(); } }, { label: 'Change players', alt: true, go: menu }]);
    }
  }, last && winners.length === 1 ? 1800 : 900);
}

// ——— drawing ———
function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.clearRect(0, 0, W, H);
  ctx.save(); if (G.shake > 0 && !calm) ctx.translate(rnd(-1, 1) * G.shake * 12 * S, rnd(-1, 1) * G.shake * 12 * S);
  if (bg) ctx.drawImage(bg, 0, 0, W, H);
  for (const h of holes) {
    const o = out(h); if (!h.kind || o <= 0) continue;
    const size = 21 * U, rise = o * 9 * U, wob = h.hit ? 0 : Math.sin(G.clock * 9 + h.wob) * 0.1;
    let sx = 1, sy = 1;
    if (h.hit && h.kind !== 'puffer') { sx = 1.18; sy = 0.72; }
    if (h.kind === 'puffer') { const s = h.hit ? 1.35 : 1 + Math.sin(G.clock * 5 + h.wob) * 0.05; sx = sy = s; }
    const x = h.x, y = h.y + size * 0.42 - rise - size * 0.2;
    // a golden crab's light spills over the sand (drawn before the clip, so it fades out softly)
    if (h.kind === 'gold') { const halo = glow(Math.round(size)), hd = halo.width / DPR; ctx.globalAlpha = Math.min(1, o * 1.4); ctx.drawImage(halo, x - hd / 2, y - hd / 2, hd, hd); ctx.globalAlpha = 1; }
    ctx.save();
    ctx.beginPath(); ctx.rect(h.x - h.rx * 1.6, h.y - 40 * U, h.rx * 3.2, 40 * U + h.ry * 0.4); ctx.clip(); // nothing shows below the near rim
    if (h.kind === 'gold') {
      const t = gold(Math.round(size)), d = t.width / DPR;
      ctx.save(); ctx.translate(x, y); ctx.rotate(wob); ctx.scale(sx, sy); ctx.drawImage(t, -d / 2, -d / 2, d, d); ctx.restore();
    } else stamp(ctx, KINDS[h.kind].e, size, x, y, { rot: wob, sx, sy });
    ctx.restore();
    if (h.hit && h.kind !== 'puffer') stamp(ctx, '💫', 9 * U, x + 4 * U, y - size * 0.55, { alpha: Math.max(0, 1 - h.hit / 0.22) });
  }
  if (lips) ctx.drawImage(lips, 0, 0, W, H);
  drawFx(ctx);
  ctx.restore();
  hud();
}
// over the sea: who's playing and their score on the left, the clock on the right
function hud() {
  if (G.state === 'setup' || G.state === 'ready' || !G.players.length) return;
  const p = G.players[G.cur], x = 5 * U, y = 7 * U, playing = G.state === 'play';
  const label = G.players.length === 1 ? 'YOUR SCORE' : who(G.cur).toUpperCase(), fl = Math.max(9, 3.3 * U), fs = Math.max(20, 8.4 * U), fm = Math.max(10, 3.6 * U);
  const left = panel('score', [label, G.score, playing ? mult() : 1, W].join('|'), W * 0.62, y + 16 * U, (g) => {
    g.save(); g.shadowColor = 'rgba(3,20,26,.55)'; g.shadowBlur = 8 * S;
    g.fillStyle = '#fff'; g.beginPath(); g.arc(x + 4.5 * U, y + 4.5 * U, 4.5 * U, 0, 7); g.fill();
    g.restore();
    g.lineWidth = 2.5 * S; g.strokeStyle = p.c; g.beginPath(); g.arc(x + 4.5 * U, y + 4.5 * U, 4.5 * U, 0, 7); g.stroke();
    stamp(g, p.e, 5.6 * U, x + 4.5 * U, y + 4.7 * U);
    g.save(); g.shadowColor = 'rgba(3,20,26,.6)'; g.shadowBlur = 10 * S; g.fillStyle = '#fff'; g.textAlign = 'left'; g.textBaseline = 'alphabetic';
    g.font = `800 ${fl}px Manrope, sans-serif`; g.fillText(label, x + 11.5 * U, y + 1.2 * U + fl * 0.66);
    g.font = `700 ${fs}px Fraunces, Georgia, serif`; g.fillText(String(G.score), x + 11.2 * U, y + 2.8 * U + fs);
    const sw = g.measureText(String(G.score)).width;
    g.restore();
    if (playing && mult() > 1) {
      const bx = x + 11.2 * U + sw + 3 * U, byy = y + 2.8 * U + fs * 0.32, bh = fm * 1.65, bw = fm * 3;
      g.fillStyle = '#E8A44C'; rrect(g, bx, byy, bw, bh, bh / 2); g.fill();
      g.fillStyle = '#fff'; g.font = `800 ${fm}px Manrope, sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(`×${mult()}`, bx + bw / 2, byy + bh * 0.54);
    }
  });
  ctx.drawImage(left.c, 0, 0, left.w, left.h);
  // the clock: a ring that empties, gold, then coral for the last five seconds
  const cx = W - 10 * U, cy = y + 4.8 * U, r = 5.6 * U, share = clamp(G.time / ROUND, 0, 1), hurry = playing && G.time <= 5, sec = Math.max(0, Math.ceil(G.time));
  ctx.lineWidth = 1.5 * U; ctx.strokeStyle = 'rgba(255,255,255,.3)'; ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.stroke();
  ctx.strokeStyle = hurry ? '#ff8fa3' : '#ffd166'; ctx.lineCap = 'round'; ctx.beginPath(); ctx.arc(cx, cy, r, -Math.PI / 2, -Math.PI / 2 + share * Math.PI * 2); ctx.stroke();
  const fd = Math.max(12, 4.6 * U), box = fd * 2.2;
  const digit = panel('clock', [sec, W].join('|'), box, box, (g) => {
    g.shadowColor = 'rgba(3,20,26,.6)'; g.shadowBlur = 8 * S; g.fillStyle = '#fff'; g.font = `800 ${fd}px Manrope, sans-serif`;
    g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(String(sec), box / 2, box / 2 + 0.3 * U);
  });
  const beat = hurry && !calm ? 1 + Math.max(0, Math.sin(G.clock * Math.PI * 2)) * 0.12 : 1, bd = box * beat;
  ctx.drawImage(digit.c, cx - bd / 2, cy - bd / 2, bd, bd);
  // 3, 2, 1 before the start
  if (G.state === 'count') {
    const n = Math.ceil(G.count), k = G.count - Math.floor(G.count), s = calm ? 1 : 1 + k * 0.35;
    ctx.fillStyle = 'rgba(3,26,33,.18)'; ctx.fillRect(0, 0, W, H);
    ctx.save(); ctx.translate(W / 2, H * 0.58); ctx.scale(s, s); ctx.globalAlpha = calm ? 1 : Math.min(1, k * 3 + 0.2);
    ctx.font = `700 ${30 * U}px Fraunces, Georgia, serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
    ctx.lineWidth = 3 * U; ctx.strokeStyle = 'rgba(255,255,255,.95)'; ctx.strokeText(String(n), 0, 0); ctx.fillStyle = '#E7607A'; ctx.fillText(String(n), 0, 0);
    ctx.restore();
  }
}

function menu() {
  stop(); G.state = 'setup'; G.players = []; for (const h of holes) h.kind = null; clearFx(); draw();
  overlay(ov, `<div class="avatar">🦀</div><h2>Crab Pop</h2><p class="rules">Tap the crabs before they dive back into the sand. Golden ones are worth 3. Leave the pufferfish alone! 🐡</p>${G.best ? `<p class="q">Best on this phone: ${G.best}</p>` : '<p class="q">Who’s playing?</p>'}`,
    [{ label: 'Just me', go: () => setup(1) }, { label: '2 players', alt: true, go: () => setup(2) }, { label: '3 players', alt: true, go: () => setup(3) }, { label: '4 players', alt: true, go: () => setup(4) }]);
}

// ——— input: every finger counts, the moment it touches. On a keyboard, 1–9 are the holes, as on a phone's keypad. ———
cv.tabIndex = 0;
cv.addEventListener('pointerdown', (e) => { e.preventDefault(); const r = cv.getBoundingClientRect(); hit(e.clientX - r.left, e.clientY - r.top); });
cv.addEventListener('keydown', (e) => {
  if (!/^[1-9]$/.test(e.key)) return;
  e.preventDefault(); const h = holes[+e.key - 1]; hit(h.x, h.y - 9 * U * Math.max(0.5, out(h)));
});

fit(); menu();
</script>
</body>
