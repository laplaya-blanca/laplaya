  <meta name="description" content="Crêpes, waffles, pancakes, boba, shakes and fresh juice on the white-sand shore of Lake Qaraoun, West Bekaa. See the menu, order on WhatsApp, plan an event.">

  <!-- Netlify Identity: only loaded when an invite / recovery / login link lands here, then hands the owner on to /admin -->
  <script>
    if (/(invite|recovery|confirmation|email_change)_token=|access_token=/.test(location.hash)) {
      var s = document.createElement('script');
      s.src = 'https://identity.netlify.com/v1/netlify-identity-widget.js';
      s.onload = function () { window.netlifyIdentity.on('login', function () { document.location.href = '/admin/'; }); };
      document.head.appendChild(s);
    }
  </script>
</head>
<body>
  <div id="root"></div>
  <noscript>La Playa Blanca — call or WhatsApp +961 71 245 911 to order.</noscript>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
